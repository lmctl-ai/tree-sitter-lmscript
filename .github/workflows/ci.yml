name: grammar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grammar:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install private CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/tree-sitter" tree-sitter-cli@0.27.1
          echo "TREE_SITTER=$RUNNER_TEMP/tree-sitter/node_modules/.bin/tree-sitter" >> "$GITHUB_ENV"
          echo "TREE_SITTER_LIB=$RUNNER_TEMP/lmscript.so" >> "$GITHUB_ENV"
      - name: Generated parser freshness
        run: |
          "$TREE_SITTER" generate
          "$TREE_SITTER" generate lmcode-body/grammar.js -o lmcode-body/src
          git diff --exit-code -- src/parser.c src/grammar.json src/node-types.json lmcode-body/src
      - name: Corpus and contract tests
        run: |
          "$TREE_SITTER" test
          "$TREE_SITTER" test --grammar-path lmcode-body
          node --test test/body-layer.mjs
          "$TREE_SITTER" build --output "$TREE_SITTER_LIB"
          node --test test/contracts.mjs
          node scripts/conformance-selftest.mjs
          node scripts/conformance.mjs
      - name: Required failing controls
        run: node scripts/mutate.mjs
