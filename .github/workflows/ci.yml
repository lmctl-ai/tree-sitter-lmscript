name: grammar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  parse:
    strategy:
      matrix: { os: [ubuntu-24.04, macos-14] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install tree-sitter CLI
        run: npm install --prefix "$RUNNER_TEMP/tree-sitter" tree-sitter-cli@0.27.1
      - name: Generate and test grammar
        env:
          TREE_SITTER: ${{ runner.temp }}/tree-sitter/node_modules/.bin/tree-sitter
        run: |
          "$TREE_SITTER" generate
          "$TREE_SITTER" test
          "$TREE_SITTER" build --output "$RUNNER_TEMP/lmscript.so"
      - name: Fetch pinned language corpora
        run: |
          git clone --depth 1 https://github.com/lmctlhq/lmctl-mono.git "$RUNNER_TEMP/lmctl-mono"
          git clone --depth 1 https://github.com/lmctlhq/skills-scripts.git "$RUNNER_TEMP/skills-scripts"
      - name: Zero-error conformance
        env:
          TREE_SITTER: ${{ runner.temp }}/tree-sitter/node_modules/.bin/tree-sitter
          TREE_SITTER_LIB: ${{ runner.temp }}/lmscript.so
          MONO_ROOT: ${{ runner.temp }}/lmctl-mono
          SKILLS_ROOT: ${{ runner.temp }}/skills-scripts
        run: node scripts/conformance.mjs
